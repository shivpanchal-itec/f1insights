<!DOCTYPE html>
<html lang="en">
<head>
    <!--Shiv panchal
      ITEC 362-J10-->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback | Formula 1 Insights</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Header -->
  <header class="site-header">

    <a class="logo" href="index.html">
      <img src="logo.png" alt="Formula 1 Insights">
    </a>

    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="schedule.html">Schedule</a>
      <a href="championships.html">Championships</a>
      <a href="beginner-guide.html">Beginner’s Guide</a>
    </nav>

  </header>


  <main>

    <!-- Feedback Header -->
    <section class="feedback-hero">

      <h1>Share your Feedback</h1>

      <p>Help us improve Formula 1 Insights</p>

    </section>


    <!-- Feedback Form -->
    <section class="feedback-section">

      <form class="feedback-form">

        <!-- First Name -->
        <div class="form-group short-field">

          <label for="first-name">First Name</label>

          <input
            type="text"
            id="first-name"
            name="first-name"
            placeholder="John"
          >

        </div>


        <!-- Last Name -->
        <div class="form-group short-field">

          <label for="last-name">Last Name</label>

          <input
            type="text"
            id="last-name"
            name="last-name"
            placeholder="Roberts"
          >

        </div>


        <!-- Email -->
        <div class="form-group short-field">

          <label for="email">Email</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="abd@email.com"
          >

        </div>


        <!-- What did you like? -->
        <div class="form-group">

          <label for="likes">
            What did you like about us?
          </label>

          <textarea
            id="likes"
            name="likes"
            placeholder="Thoughts..."
          ></textarea>

        </div>


        <!-- Suggestions -->
        <div class="form-group">

          <label for="suggestions">
            What more would you like to see?
          </label>

          <textarea
            id="suggestions"
            name="suggestions"
            placeholder="Suggestions..."
          ></textarea>

        </div>


        <!-- Submit -->
        <button class="feedback-submit" type="submit">
          Submit Feedback
        </button>

      </form>

    </section>

  </main>


  <!-- Footer -->
  <footer class="site-footer">

    <div class="footer-brand">
      Formula 1 Insights
    </div>

    <div></div>

    <div class="social-icons">

      <!-- Instagram -->
      <a href="#" aria-label="Instagram">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect
            x="3"
            y="3"
            width="22"
            height="22"
            rx="6"
            stroke="white"
            stroke-width="2"
          />

          <circle
            cx="14"
            cy="14"
            r="5"
            stroke="white"
            stroke-width="2"
          />

          <circle
            cx="20"
            cy="8"
            r="1.3"
            fill="white"
          />
        </svg>
      </a>


      <!-- YouTube -->
      <a href="#" aria-label="YouTube">
        <svg width="34" height="28" viewBox="0 0 34 28" fill="none">

          <rect
            x="2"
            y="5"
            width="30"
            height="18"
            rx="5"
            stroke="white"
            stroke-width="2"
          />

          <path
            d="M14 10L23 14L14 18V10Z"
            fill="white"
          />

        </svg>
      </a>

    </div>

  </footer>

</body>
</html>
